name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify iPhone source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform ios
        env:
          EXPO_PUBLIC_PRIVATE_SYNC_ENABLED: 'false'

  ios-store:
    name: iOS store build and submit
    runs-on: macos-latest
    needs: verify
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_PRIVATE_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Check store build authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::EXPO_TOKEN is missing. No signed IPA or TestFlight submission can be produced.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --yes eas-cli@latest build --platform ios --profile production --non-interactive --wait --auto-submit
