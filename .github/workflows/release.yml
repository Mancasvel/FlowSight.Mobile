name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-submit-ios:
    name: Build & Submit iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npx eas build --platform ios --profile production --non-interactive
      - run: npx eas submit --platform ios --non-interactive

  build-and-submit-android:
    name: Build & Submit Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npx eas build --platform android --profile production --non-interactive
      - run: npx eas submit --platform android --non-interactive
